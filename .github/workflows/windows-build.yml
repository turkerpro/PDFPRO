name: Windows Build & Release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows
  QT_VERSION: 6.10.2

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_ROOT }}"
          & "${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat"

      - name: Install dependencies with vcpkg
        shell: pwsh
        run: |
          # Classic mode: manifest'i bypass et, qt6 jurplel/install-qt-action'dan geliyor
          & "${{ env.VCPKG_ROOT }}/vcpkg.exe" install --classic --triplet=x64-windows poppler qpdf tesseract leptonica nlohmann-json spdlog

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: win64_msvc2022_64
          modules: qtcharts qtwebengine
          cache: true

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          $env:CMAKE_TOOLCHAIN_FILE = "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" `
            -DCMAKE_BUILD_TYPE=Release `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        shell: pwsh
        run: |
          cd build
          ctest -C Release --output-on-failure --parallel 4

      - name: Package (NSIS)
        shell: pwsh
        run: |
          cmake --build build --config Release --target package

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: pdfpro-windows-installer
          path: build/*.exe
          retention-days: 7

      - name: Create MSIX (for Store)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          echo "MSIX packaging would run here for tagged releases"

  # Linux build for cross-platform verification
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Qt (6.10+)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: linux
          modules: qtcharts qtwebengine
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpoppler-qt6-dev libpoppler-cpp-dev libpoppler-glib-dev \
            libqpdf-dev \
            libtesseract-dev libleptonica-dev \
            cmake ninja-build

      - name: Configure CMake
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run Tests
        run: |
          cd build && ctest --output-on-failure

  release:
    needs: [build, linux-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: pdfpro-windows-installer
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false